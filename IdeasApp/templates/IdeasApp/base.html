<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestion des idées{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --esp-red: #e30613;
            --esp-red-dark: #b8050f;
            --esp-dark: #1d1d1f;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Poppins', sans-serif; background: #f6f7f9; color: var(--esp-dark);
            display: flex; flex-direction: column; min-height: 100vh;
        }
        main { flex: 1; }
        a { color: var(--esp-red); }
        a:hover { color: var(--esp-red-dark); }

        .main-nav { background: #fff; border-bottom: 3px solid var(--esp-red); }
        .main-nav .navbar-brand { color: var(--esp-red); font-weight: 600; font-size: 1.4rem; }
        .main-nav .nav-link { color: var(--esp-dark); font-weight: 500; }
        .main-nav .nav-link:hover { color: var(--esp-red); }

        .btn-primary {
            --bs-btn-bg: var(--esp-red); --bs-btn-border-color: var(--esp-red);
            --bs-btn-hover-bg: var(--esp-red-dark); --bs-btn-hover-border-color: var(--esp-red-dark);
            --bs-btn-active-bg: var(--esp-red-dark); --bs-btn-active-border-color: var(--esp-red-dark);
        }
        .btn-outline-primary {
            --bs-btn-color: var(--esp-red); --bs-btn-border-color: var(--esp-red);
            --bs-btn-hover-bg: var(--esp-red); --bs-btn-hover-border-color: var(--esp-red);
            --bs-btn-active-bg: var(--esp-red-dark); --bs-btn-active-border-color: var(--esp-red-dark);
        }
        .btn { border-radius: 50rem; padding-left: 1.1rem; padding-right: 1.1rem; }

        .card { border: 0; border-radius: 16px; }
        .table-light { --bs-table-bg: #fff; }
        .form-control:focus, .form-select:focus {
            border-color: var(--esp-red);
            box-shadow: 0 0 0 .25rem rgba(227, 6, 19, .15);
        }

        .site-footer { background: var(--esp-dark); color: #bbb; font-size: .85rem; padding: 1.2rem 0; margin-top: 3rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand main-nav mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% block brand_link %}{% url 'ideas:idea_list' %}{% endblock %}">UniSphere</a>
            {% block nav_links %}
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'ideas:idea_list' %}">Mes idées</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'ideas:idea_create' %}">Nouvelle idée</a></li>
            </ul>
            {% endblock %}
        </div>
    </nav>

    <main class="container">
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">© 2026 UniSphere</div>
    </footer>
</body>
</html>
