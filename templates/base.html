{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}
        Gestion des idées
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'main.css' %}" />
    <script src="{% static 'event_map.js' %}" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand main-nav mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">UniSphere</a>
        {% block nav_links %}
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'clubs:liste' %}">Clubs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'events:liste' %}">Événements</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'events:create' %}">Nouvel événement</a>
            </li>
          </ul>
        {% endblock %}
      </div>
    </nav>

    <main class="container">
      {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
      {% endfor %}
      {% block content %}

      {% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 UniSphere</div>
    </footer>
  </body>
</html>
